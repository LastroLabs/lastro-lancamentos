# Listas de preservação da anonimização (IA-01, RF-SEG-03, D-03).
# Lidas por src/lastro/ai/anonymization.py. Mudou uma palavra? Mude aqui, com fonte, em PR.
#
# operacao: ficam em claro em todos os níveis. Fonte: documento público em que a palavra
#   aparece inteira (sem acento), com a data de acesso.
# atividade: ficam em claro só no nível pessoas_protegidas. Fonte: subclasse CNAE 2.3 cuja
#   descrição ou observações têm a palavra (singular ou plural), conferida na API do IBGE
#   https://servicodados.ibge.gov.br/api/v2/cnae/subclasses (acesso em 23/11/2026).
# conflito: palavras de atividade que também são prenome na lista de nomes do Censo 2010
#   (API de nomes do IBGE). Nunca ficam em claro: são tratadas como parte do nome.
# revisado: handle de quem conferiu a fonte, ou 'pendente'.
# Nenhum nome de pessoa ou de empresa tirado de extrato entra aqui (SECURITY.md).
