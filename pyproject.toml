[project]
name = "lastro"
version = "0.1.0"
description = "Lastro: leitura e conferência de extratos bancários para escritórios contábeis"
requires-python = ">=3.14,<3.15"
# Plan NUC-01, D3. Exact versions live in uv.lock (D6); here only the lower bounds.
dependencies = [
    "alembic>=1.20",
    # ACE-01, plan D4: password hashing with Argon2 (stack: "senha com Argon2").
    "argon2-cffi>=25.1",
    "fastapi>=0.165",
    "psycopg[binary]>=3.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    # IA-01, plan D7: preservation lists of the anonymization (src/lastro/ai/).
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    # Issue #93, plan D5: the suite runs in parallel processes (MIT; chosen over
    # pytest-parallel, unmaintained since 2021, and pytest-run-parallel, made for threads).
    "pytest-xdist>=3.8",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.15",
]

[tool.uv]
# The code is not installed as a package: the image uses PYTHONPATH=/app/src (plan D6).
package = false

[tool.pytest.ini_options]
# Issue #93, plan D6 (DECISIONS §12, V2): `-n auto` asks tests/conftest.py how many processes
# to use. A whole suite or folder runs in up to 4; one file or one test (`::`, as in
# `hx feature verify`) runs in series. `loadgroup` keeps each `xdist_group` in one process.
# To debug in series: `pytest -n 0`.
addopts = "-n auto --dist loadgroup"

[tool.ruff.lint]
# EXE002: no Docker Desktop (Windows) o bind mount mostra todo arquivo como executável (755),
# então o ruff do container acusa "executável sem shebang" em arquivos que não são.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# Estilo do teste da fase E (dict(...), `# fmt: skip` em expressão, dict mutável na classe do
# git falso). O teste é a prova e não se edita ao implementar (AGENTS.md, regra 3).
"tests/harness/test_fase_e.py" = ["C408", "RUF012", "RUF028"]
# IA-01: o teste foi escrito antes de existir src/lastro/ai/ e o ruff ainda via `lastro` como
# pacote de terceiros (import sem linha em branco). Mesma regra 3 acima; a causa está no isort abaixo.
"tests/ai/test_anonimizar.py" = ["I001"]

[tool.ruff.lint.isort]
# `lastro` é sempre o pacote do projeto, mesmo antes de o módulo importado existir.
known-first-party = ["lastro"]
